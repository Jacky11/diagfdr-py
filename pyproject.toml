[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagfdr"
version = "0.1.0"
description = "Scope, calibration and stability diagnostics for target-decoy FDR claims in proteomics (Python port of the R package diagFDR)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Quentin Giai Gianetto", email = "quentin.giaigianetto@pasteur.fr"}]
keywords = ["proteomics", "false discovery rate", "target-decoy", "entrapment", "DIA-NN", "mokapot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "jinja2>=3.0"]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
test = ["pytest>=7", "pyarrow>=12"]

[project.scripts]
diagfdr = "diagfdr.cli:main"

[project.urls]
Homepage = "https://github.com/Jacky11/diagFDR"
"R package" = "https://cran.r-project.org/package=diagFDR"
Paper = "https://doi.org/10.64898/2026.04.16.718468"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diagfdr = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
